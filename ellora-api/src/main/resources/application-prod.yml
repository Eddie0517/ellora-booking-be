# ==============================================================================
# Production profile — Ellora Booking Backend
#
# Activated with SPRING_PROFILES_ACTIVE=prod.
# Every value is environment-driven; no secret may be written here.
# ==============================================================================
server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ellora}
    username: ${DB_USER:ellora}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false

# Swagger/OpenAPI is a development tool; it must not be reachable in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  mail:
    enabled: true
    from: ${MAIL_FROM:no-reply@ellora.vn}
    from-name: ${MAIL_FROM_NAME:Ellora Booking}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ellorabooking.online}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.ellora: ${LOGGING_LEVEL_ELLORA:INFO}
    org.flywaydb: INFO
