# CD — ellora production
#
# Trigger: annotated tag v* (or manual dispatch).
# Builds the image, pushes to GHCR, then pins the digest and rolls out on the
# VPS through the Cloudflare Tunnel stack. The app secret file
# /opt/ellora/.env.production lives on the VPS and is never overwritten here.
name: CD — ellora production

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: ellora-production
    cancel-in-progress: false

env:
    TARGET_ENV: production
    IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'ghcr.io/eddie0517/ellora' }}

jobs:
    build-push:
        name: Build and push api
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push immutable image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-api:${{ env.TARGET_ENV }}-${{ github.sha }}
                      ${{ env.IMAGE_PREFIX }}-api:${{ env.TARGET_ENV }}-latest
                  cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:${{ env.TARGET_ENV }}-buildcache
                  cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:${{ env.TARGET_ENV }}-buildcache,mode=max

    deploy:
        name: Deploy production
        needs: build-push
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: production
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Prepare SSH
              shell: bash
              run: |
                  set -euo pipefail
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Upload deployment files
              shell: bash
              env:
                  COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
              run: |
                  set -euo pipefail
                  tar -czf /tmp/ellora-deploy.tar.gz \
                    "${COMPOSE_FILE}" \
                    deployments/scripts \
                    .env.production.example
                  scp -P "${{ secrets.DEPLOY_PORT }}" /tmp/ellora-deploy.tar.gz \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/ellora-deploy.tar.gz"

            - name: Install deployment files
              shell: bash
              run: |
                  set -euo pipefail
                  ssh -p "${{ secrets.DEPLOY_PORT }}" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "set -e; mkdir -p '${{ vars.APP_PATH }}'; \
                     tar -xzf /tmp/ellora-deploy.tar.gz -C '${{ vars.APP_PATH }}'; \
                     rm -f /tmp/ellora-deploy.tar.gz; \
                     find '${{ vars.APP_PATH }}/deployments/scripts' -name '*.sh' -exec chmod +x {} \;"

            - name: Verify app env is complete
              shell: bash
              run: |
                  set -euo pipefail
                  ssh -p "${{ secrets.DEPLOY_PORT }}" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "cd '${{ vars.APP_PATH }}' && \
                     test -f '${{ vars.ENV_FILE }}' || { echo 'missing ${{ vars.ENV_FILE }} on VPS' >&2; exit 1; } && \
                     bash deployments/scripts/verify-env.sh '${{ vars.ENV_FILE }}' .env.production.example"

            - name: Login VPS to private GHCR
              shell: bash
              run: |
                  set -euo pipefail
                  printf '%s' "${{ secrets.GHCR_READ_TOKEN }}" | \
                    ssh -p "${{ secrets.DEPLOY_PORT }}" \
                      "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                      "docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin"

            - name: Ensure deploy env keys
              shell: bash
              env:
                  DEPLOY_FILE: ${{ vars.DEPLOY_FILE }}
              run: |
                  set -euo pipefail
                  ssh -p "${{ secrets.DEPLOY_PORT }}" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "set -e
                     cd '${{ vars.APP_PATH }}'
                     touch '${DEPLOY_FILE}'
                     grep -q '^API_IMAGE=' '${DEPLOY_FILE}' || printf 'API_IMAGE=placeholder\\n' >> '${DEPLOY_FILE}'
                     chmod 600 '${DEPLOY_FILE}'"

            - name: Deploy pinned image and restart tunnel
              shell: bash
              env:
                  APP_PATH: ${{ vars.APP_PATH }}
                  COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
                  ENV_FILE: ${{ vars.ENV_FILE }}
                  DEPLOY_FILE: ${{ vars.DEPLOY_FILE }}
                  APP_SERVICES: ${{ vars.APP_SERVICES }}
                  INFRA_SERVICES: ${{ vars.INFRA_SERVICES }}
                  PROXY_SERVICE: ${{ vars.PROXY_SERVICE }}
              run: |
                  set -euo pipefail
                  image="${IMAGE_PREFIX}-api"
                  digest=$(docker buildx imagetools inspect "${image}:${TARGET_ENV}-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
                  ref="${image}@${digest}"
                  echo "Deploying ${ref}"
                  ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                    -p "${{ secrets.DEPLOY_PORT }}" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "cd '${APP_PATH}' && \
                     APP_SERVICES='${APP_SERVICES}' \
                     INFRA_SERVICES='${INFRA_SERVICES}' \
                     INFRA_PROFILE='' \
                     DB_INIT_SERVICE='none' \
                     DB_INIT_PROFILE='' \
                     MIGRATE_SERVICES='none' \
                     MIGRATE_PROFILE='migrate' \
                     PROXY_SERVICE='${PROXY_SERVICE}' \
                     bash deployments/scripts/deploy-release.sh \
                       '${COMPOSE_FILE}' '${ENV_FILE}' '${DEPLOY_FILE}' 'api=${ref}'"

            - name: Smoke public health
              shell: bash
              env:
                  HEALTH_URL: ${{ vars.HEALTH_URL }}
              run: |
                  set -euo pipefail
                  for _ in $(seq 1 20); do
                    if curl -fsS --max-time 15 "${HEALTH_URL}" >/dev/null; then
                      echo "OK: ${HEALTH_URL}"
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "Health check failed: ${HEALTH_URL}" >&2
                  exit 1

            - name: Diagnostics on failure
              if: failure()
              shell: bash
              run: |
                  ssh -o ConnectTimeout=15 -p "${{ secrets.DEPLOY_PORT }}" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "cd '${{ vars.APP_PATH }}' && \
                     docker compose --env-file '${{ vars.ENV_FILE }}' --env-file '${{ vars.DEPLOY_FILE }}' \
                       -f '${{ vars.COMPOSE_FILE }}' ps && \
                     docker compose --env-file '${{ vars.ENV_FILE }}' --env-file '${{ vars.DEPLOY_FILE }}' \
                       -f '${{ vars.COMPOSE_FILE }}' logs --tail=120 api cloudflared" || true
