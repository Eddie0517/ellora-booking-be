server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ellora-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.ellora: INFO
    org.flywaydb: INFO
app:
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/owner/subscription}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/owner/subscription}
